<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a090e">
<title>Farouk Grup | بطاقة أعمال - نور الغراوي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --gold: #c9a043;
    --gold-light: #e2bc6e;
    --gold-soft: rgba(201, 160, 67, 0.15);
    --bg: #0a090e;
    --card: #12111a;
    --text: #f3e9d0;
    --text-muted: #c9bfa8;
    --border: rgba(201, 160, 67, 0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Tajawal', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 12px;
    color: var(--text);
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 28px;
    border: 1px solid var(--border);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,160,67,0.08);
    overflow: hidden;
    animation: fadeUp 0.6s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Header / Image */
  .header {
    position: relative;
    padding: 32px 24px 20px;
    text-align: center;
    background: linear-gradient(180deg, #16151f 0%, var(--card) 100%);
  }

  .avatar-wrap {
    width: 130px;
    height: 130px;
    margin: 0 auto 18px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    box-shadow: 0 8px 25px rgba(201,160,67,0.25);
  }

  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 20%;
    border: 3px solid var(--card);
    display: block;
  }

  .name {
    font-size: 1.7rem;
    font-weight: 800;
    line-height: 1.25;
    margin-bottom: 6px;
  }

  .name-sub {
    font-size: 0.85rem;
    color: var(--gold-light);
    font-weight: 500;
    margin-bottom: 8px;
  }

  .title {
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  /* Language Switch */
  .lang-switch {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 18px;
  }

  .lang-btn {
    background: transparent;
    border: 1px solid rgba(201,160,67,0.4);
    color: var(--gold-light);
    padding: 5px 16px;
    border-radius: 30px;
    font-size: 0.78rem;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }

  .lang-btn.active,
  .lang-btn:hover {
    background: var(--gold);
    color: #0a090e;
    border-color: var(--gold);
  }

  /* Content */
  .content {
    padding: 8px 22px 28px;
  }

  .bio {
    font-size: 0.92rem;
    line-height: 1.7;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 22px;
    padding: 0 6px;
  }

  /* Main Actions */
  .main-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 22px;
  }

  .btn-main {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.95rem;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.25s;
  }

  .btn-whatsapp {
    background: linear-gradient(105deg, var(--gold), var(--gold-light));
    color: #111;
  }

  .btn-whatsapp:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(201,160,67,0.35);
  }

  .btn-save {
    background: transparent;
    border: 2px solid var(--gold);
    color: var(--gold);
  }

  .btn-save:hover {
    background: var(--gold);
    color: #111;
  }

  /* Secondary Links */
  .links-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .link-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: var(--text-muted);
    font-size: 0.72rem;
    transition: all 0.2s;
  }

  .link-item i {
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,160,67,0.2);
    border-radius: 14px;
    font-size: 1.15rem;
    color: var(--gold);
    transition: all 0.2s;
  }

  .link-item:hover {
    color: var(--text);
  }

  .link-item:hover i {
    background: var(--gold);
    color: #111;
    border-color: var(--gold);
    transform: translateY(-3px);
  }

  /* QR Section */
  .qr-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 18px;
    background: rgba(255,255,255,0.02);
    border-radius: 18px;
    border: 1px solid rgba(201,160,67,0.12);
    margin-bottom: 18px;
  }

  .qr-section img {
    width: 120px;
    height: 120px;
    border-radius: 12px;
    background: #fff;
    padding: 6px;
  }

  .qr-label {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* Footer */
  .footer {
    text-align: center;
    font-size: 0.72rem;
    color: #7a7466;
    padding-top: 6px;
  }

  /* Responsive tweaks */
  @media (max-width: 380px) {
    .name { font-size: 1.5rem; }
    .links-grid { gap: 8px; }
    .link-item i { width: 42px; height: 42px; font-size: 1.05rem; }
  }
</style>
</head>
<body>
  <div class="card">
    <!-- Header -->
    <div class="header">
      <div class="avatar-wrap">
        <img class="avatar" src="https://lh3.googleusercontent.com/d/1MmMIr5icQTlSmLKbjRvHWj6BWXycoN8T=w800-h1000" alt="Nour Ghrawi" loading="lazy">
      </div>
      <div class="name">
        <span class="name-ar">نور الغراوي</span>
        <span class="name-en" style="display:none;">Nour Ghrawi</span>
      </div>
      <div class="name-sub" id="nameSub">Nour Ghrawi</div>
      <div class="title" id="titleBlock">مسؤول مالي وإداري</div>

      <div class="lang-switch">
        <button type="button" class="lang-btn active" data-lang="ar">العربية</button>
        <button type="button" class="lang-btn" data-lang="en">English</button>
      </div>
    </div>

    <!-- Content -->
    <div class="content">
      <p class="bio" id="bioText">مسؤول مالي وإداري | خبرة في إدارة الحسابات والتقارير المالية والعمليات الإدارية وتنظيم الإجراءات الداخلية.</p>

      <!-- Main Buttons -->
      <div class="main-actions">
        <a href="https://wa.me/905357218541" target="_blank" rel="noopener" class="btn-main btn-whatsapp">
          <i class="fab fa-whatsapp"></i>
          <span id="whatsappBtn">واتس آب</span>
        </a>
        <button type="button" class="btn-main btn-save" id="saveContactBtn">
          <i class="fas fa-address-card"></i>
          <span id="saveBtn">حفظ جهة الاتصال</span>
        </button>
      </div>

      <!-- Secondary Links -->
      <div class="links-grid">
        <a href="https://www.farouk-grup.com/" target="_blank" rel="noopener" class="link-item">
          <i class="fas fa-globe"></i>
          <span id="websiteBtn">الموقع</span>
        </a>
        <a href="https://training.farouk-grup.com/" target="_blank" rel="noopener" class="link-item">
          <i class="fas fa-chalkboard-user"></i>
          <span id="trainingBtn">الدورات</span>
        </a>
        <a href="mailto:f.grup.finans@gmail.com" class="link-item">
          <i class="fas fa-envelope"></i>
          <span id="emailBtn">البريد</span>
        </a>
      </div>

      <!-- QR Code -->
      <div class="qr-section">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://wa.me/905357218541&bgcolor=ffffff&color=0a090e" alt="QR Code" loading="lazy">
        <span class="qr-label" id="qrLabel">امسح للتواصل عبر واتساب</span>
      </div>

      <div class="footer" id="footerNote">مجموعة فاروق للإستشارات والأعمال</div>
    </div>
  </div>

<script>
  // ===== vCard =====
  function generateVCard(lang) {
    const phone = "+905357218541";
    const email = "f.grup.finans@gmail.com";
    const website = "https://www.farouk-grup.com";
    const company = "Farouk Grup";
    let fn, n, title, note;

    if (lang === "ar") {
      fn = "نور الغراوي";
      n = "الغراوي;نور;;;";
      title = "مسؤول مالي وإداري";
      note = "إدارة مالية وإدارية";
    } else {
      fn = "Nour Ghrawi";
      n = "Ghrawi;Nour;;;";
      title = "Financial & Administrative Officer";
      note = "Financial & Administrative Management";
    }

    let vcard = "BEGIN:VCARD\r\nVERSION:3.0\r\n";
    vcard += `FN:${fn}\r\n`;
    vcard += `N:${n}\r\n`;
    vcard += `ORG:${company}\r\n`;
    vcard += `TITLE:${title}\r\n`;
    vcard += `NOTE:${note}\r\n`;
    vcard += `TEL;TYPE=CELL:${phone}\r\n`;
    vcard += `EMAIL;TYPE=WORK:${email}\r\n`;
    vcard += `URL:${website}\r\n`;
    vcard += "END:VCARD\r\n";
    return vcard;
  }

  function downloadVCard() {
    const vcardData = generateVCard(currentLanguage);
    const blob = new Blob([vcardData], { type: "text/vcard;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Nour_Ghrawi.vcf";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ===== Translations =====
  const translations = {
    ar: {
      title: "مسؤول مالي وإداري",
      bio: "مسؤول مالي وإداري | خبرة في إدارة الحسابات والتقارير المالية والعمليات الإدارية وتنظيم الإجراءات الداخلية.",
      whatsapp: "واتس آب",
      save: "حفظ جهة الاتصال",
      website: "الموقع",
      training: "الدورات",
      email: "البريد",
      qr: "امسح للتواصل عبر واتساب",
      footer: "مجموعة فاروق للإستشارات والأعمال"
    },
    en: {
      title: "Financial & Administrative Officer",
      bio: "Financial & Administrative Officer | Experience in accounting, financial reports, administrative operations and internal procedures.",
      whatsapp: "WhatsApp",
      save: "Save Contact",
      website: "Website",
      training: "Courses",
      email: "Email",
      qr: "Scan to chat on WhatsApp",
      footer: "FAROUK GRUP Consulting & Business"
    }
  };

  let currentLanguage = "ar";

  const nameAr = document.querySelector(".name-ar");
  const nameEn = document.querySelector(".name-en");
  const nameSub = document.getElementById("nameSub");
  const titleEl = document.getElementById("titleBlock");
  const bioEl = document.getElementById("bioText");
  const whatsappBtn = document.getElementById("whatsappBtn");
  const saveBtn = document.getElementById("saveBtn");
  const websiteBtn = document.getElementById("websiteBtn");
  const trainingBtn = document.getElementById("trainingBtn");
  const emailBtn = document.getElementById("emailBtn");
  const qrLabel = document.getElementById("qrLabel");
  const footerNote = document.getElementById("footerNote");
  const langBtns = document.querySelectorAll(".lang-btn");

  function setLanguage(lang) {
    currentLanguage = lang;
    const t = translations[lang];

    if (lang === "ar") {
      nameAr.style.display = "";
      nameEn.style.display = "none";
      nameSub.textContent = "Nour Ghrawi";
      document.documentElement.dir = "rtl";
      document.documentElement.lang = "ar";
    } else {
      nameAr.style.display = "none";
      nameEn.style.display = "";
      nameSub.textContent = "نور الغراوي";
      document.documentElement.dir = "ltr";
      document.documentElement.lang = "en";
    }

    titleEl.textContent = t.title;
    bioEl.textContent = t.bio;
    whatsappBtn.textContent = t.whatsapp;
    saveBtn.textContent = t.save;
    websiteBtn.textContent = t.website;
    trainingBtn.textContent = t.training;
    emailBtn.textContent = t.email;
    qrLabel.textContent = t.qr;
    footerNote.textContent = t.footer;

    langBtns.forEach(btn => btn.classList.toggle("active", btn.dataset.lang === lang));
  }

  langBtns.forEach(btn => {
    btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
  });

  // Save Contact
  document.getElementById("saveContactBtn").addEventListener("click", downloadVCard);

  // Init
  setLanguage("ar");
</script>
</body>
</html>
